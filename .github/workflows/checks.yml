name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all checks (rewrites checks.json)
        run: node checks.js
      - name: Command-line examples
        run: |
          node cli.js examples/rise-speed.json --csv /tmp/rise.csv
          node cli.js examples/collision-quartz.json --out /tmp/collision.json
      - name: Rebuild the page
        run: python3 build.py
      - name: The committed results must be reproduced
        run: git diff --exit-code checks.json index.html
